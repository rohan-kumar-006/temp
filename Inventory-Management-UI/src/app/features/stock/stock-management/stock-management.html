<div class="container mt-4">
    <div class="row mb-3">
        <div class="col-md-4">

            <input type="text" class="form-control" placeholder="Search..." [value]="search()"
                (input)="onSearch($event)">

        </div>
    </div>
    <div *ngIf="loading()" class="text-center">

        <div class="spinner-border">
        </div>

    </div>
    <div class="d-flex justify-content-between my-3 align-items-center">
        <p class="text-muted">
            Showing
            {{ products().length }}
            of
            {{ totalItems() }}
            products
        </p>
        <div class="d-flex align-items-center">

            <label class="me-2 mb-0">Show</label>

            <select class="form-select" style="width:100px" (change)="changePageSize($event)">

                <option value="10">10</option>
                <option value="20">20</option>
                <option value="50">50</option>

            </select>
        </div>
    </div>


    <table class="table table-bordered table-hover" *ngIf="!loading()">
        <thead>
            <tr>
                <th>Image</th>
                <th>Name</th>
                <th>SKU</th>
                <!-- <th>Price</th> -->
                <th>Current Quantity</th>
                <th>Reorder Level</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngIf="products().length === 0">
                <td colspan="7" class="text-center">
                    No products found.
                </td>
            </tr>

            <tr *ngFor="let product of products()">
                <td>
                    <img *ngIf="product.imageUrl" [src]="apiBaseUrl + product.imageUrl" width="50" height="50"
                        class="rounded">
                </td>
                <td>
                    {{product.name}}
                </td>
                <td>
                    {{product.sku}}
                </td>
                <!-- <td>
                    {{product.price | currency:'INR'}}
                </td> -->

                <td>
                    {{ product.quantity }}
                    <span *ngIf="product.quantity <= product.reorderLevel" class="badge bg-danger ms-2">
                        Low Stock
                    </span>
                </td>

                <td>
                    {{ product.reorderLevel }}
                </td>
                <td>

                    <button class="btn btn-success btn-sm" (click)="openStockIn(product)">
                        Stock In
                    </button>

                    <button class="btn btn-warning btn-sm ms-2" (click)="openStockOut(product)">
                        Stock Out
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
    <nav *ngIf="totalPages() > 1">

        <ul class="pagination justify-content-center">

            <li class="page-item" [class.disabled]="page()===1">

                <button class="page-link" (click)="previousPage()">

                    Previous

                </button>

            </li>

            <li *ngFor="let p of pagesList" class="page-item" [class.active]="p===page()">

                <button class="page-link" (click)="goToPage(p)">

                    {{p}}

                </button>

            </li>

            <li class="page-item" [class.disabled]="page()===totalPages()">

                <button class="page-link" (click)="nextPage()">

                    Next

                </button>

            </li>

        </ul>

    </nav>

<div class="modal fade" id="stockModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">

                <h5 class="modal-title">
                    {{ transactionType() }}
                    Stock
                </h5>

                <button
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>
            </div>
            <div class="modal-body">
                <form [formGroup]="stockForm">
                    <div class="mb-3">
                        <label>Product</label>
                        <input
                            class="form-control"
                            [value]="selectedProduct()?.name"
                            readonly>
                    </div>
                    <div class="mb-3">
                        <label>
                            Current Quantity
                        </label>
                        <input
                            class="form-control"
                            [value]="selectedProduct()?.quantity"
                            readonly>
                    </div>
                    <div class="mb-3">
                        <label>
                            Quantity
                        </label>
                        <input
                            type="number"
                            class="form-control"
                            formControlName="quantity">
                    </div>
                    <div class="mb-3">
                        <label>
                            Remarks
                        </label>
                        <textarea
                            rows="3"
                            class="form-control"
                            formControlName="remarks">
                            </textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Cancel
                </button>
                <button
                    class="btn"
                    [ngClass]="
                        transactionType() === TransactionType.In
                        ? 'btn-success'
                        : 'btn-warning'
                    "
                    [disabled]="stockForm.invalid"
                    (click)="saveTransaction()"
                    >
                    Save
                </button>
            </div>
        </div>
    </div>
</div>
