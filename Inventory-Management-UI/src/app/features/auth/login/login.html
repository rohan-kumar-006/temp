<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow-sm p-4" style="width: 380px;">

        <h3 class="text-center mb-4">
            Inventory Management
        </h3>

        <form (ngSubmit)="login()">

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    class="form-control"
                    [(ngModel)]="email"
                    name="email"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    [(ngModel)]="password"
                    name="password"
                    required />

            </div>

            <button
                class="btn btn-primary w-100"
                type="submit">

                Login

            </button>

        </form>

    </div>

</div>
